<title>Dopamine Machine</title>
<style>
  :root{
    --void:#0b0a14; --panel:#141225; --panel-2:#1b1833;
    --magenta:#ff3d8b; --magenta-soft:#ff77ae;
    --cyan:#39f0e0; --gold:#ffc63d;
    --ink:#f4f0ff; --quiet:#a89fc8; --line:#2a2547;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --disp:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--disp);
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  #fx{position:fixed;inset:0;pointer-events:none;z-index:5}
  #shake{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:2}
  .bgGlow{
    position:fixed;inset:-20%;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 60% 45% at 50% 58%, rgba(255,61,139,.13), transparent 70%);
  }

  /* ---------- score header ---------- */
  #scoreWrap{text-align:center;flex-shrink:0}
  #score{
    font-family:var(--mono);
    font-weight:900;
    font-size:clamp(44px,9vw,84px);
    letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
    line-height:1;
    text-shadow:0 0 24px rgba(255,61,139,.35);
    transition:transform .08s;
  }
  #score.pop{transform:scale(1.06)}
  #perSec{font-family:var(--mono);color:var(--quiet);font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
  #perSec b{color:var(--cyan);font-weight:600}
  #rank{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--cyan);text-transform:uppercase;margin-top:10px;opacity:.85}

  /* ---------- the orb ---------- */
  #orbZone{position:relative;width:min(46vmin,300px);height:min(46vmin,300px);flex-shrink:0}
  #orb{
    position:absolute;inset:0;
    border:none;border-radius:50%;
    cursor:pointer;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 42%),
      radial-gradient(circle at 50% 50%, var(--magenta-soft), var(--magenta) 55%, #b0175c 100%);
    box-shadow:
      0 0 60px rgba(255,61,139,.55),
      0 0 140px rgba(255,61,139,.25),
      inset 0 -18px 40px rgba(0,0,0,.35);
    transition:transform .09s cubic-bezier(.34,1.56,.64,1);
    animation:breathe 3.2s ease-in-out infinite;
    outline:none;
  }
  #orb:focus-visible{box-shadow:0 0 0 4px var(--cyan),0 0 60px rgba(255,61,139,.55)}
  #orb:active,#orb.smash{transform:scale(.9);animation:none}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  #orbLabel{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;font-weight:900;font-size:clamp(15px,2.6vmin,20px);
    letter-spacing:.22em;color:rgba(255,255,255,.92);text-transform:uppercase;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  .ring{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;
    border:3px solid var(--cyan);opacity:0;transform:scale(1);
  }
  .ring.go{animation:ringOut .5s ease-out forwards}
  @keyframes ringOut{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}

  /* ---------- fever ---------- */
  body.fever #orb{animation:breathe 1s ease-in-out infinite,hueSpin 1.4s linear infinite}
  body.fever .bgGlow{background:radial-gradient(ellipse 70% 55% at 50% 55%, rgba(255,198,61,.24), rgba(255,61,139,.14) 55%, transparent 78%)}
  @keyframes hueSpin{from{filter:hue-rotate(0deg) saturate(1.35)}to{filter:hue-rotate(360deg) saturate(1.35)}}

  /* ---------- combo + fever meters ---------- */
  #comboWrap{width:min(60vmin,340px);text-align:center}
  #comboLabel{
    font-family:var(--mono);font-size:15px;letter-spacing:.14em;color:var(--cyan);
    font-weight:700;margin-bottom:8px;opacity:0;transition:opacity .2s;
    text-transform:uppercase;font-variant-numeric:tabular-nums;
  }
  #comboLabel.hot{opacity:1}
  #comboBar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
  #comboFill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--magenta));transition:width .1s linear}
  #feverBar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:6px}
  #feverFill{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,var(--gold),#ff6a3d);transition:width .12s}
  body.fever #feverFill{animation:feverFlash .25s linear infinite alternate}
  @keyframes feverFlash{from{opacity:.65}to{opacity:1}}
  #feverTag{
    font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--gold);
    text-transform:uppercase;margin-top:5px;opacity:.55;font-variant-numeric:tabular-nums;
  }
  body.fever #feverTag{opacity:1;font-weight:700}

  /* ---------- level ---------- */
  #levelWrap{width:min(60vmin,340px)}
  #levelRow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--quiet);margin-bottom:6px;font-variant-numeric:tabular-nums}
  #levelRow b{color:var(--ink);font-weight:700}
  #xpBar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
  #xpFill{height:100%;width:0%;background:var(--magenta);border-radius:3px;transition:width .25s}

  /* ---------- heat strip ---------- */
  #heat{position:fixed;left:0;bottom:0;height:3px;width:0%;z-index:4;
    background:linear-gradient(90deg,var(--magenta),var(--gold));box-shadow:0 0 10px rgba(255,198,61,.6)}

  /* ---------- shop ---------- */
  #shop{
    position:fixed;left:14px;top:14px;bottom:14px;width:230px;z-index:3;
    display:flex;flex-direction:column;gap:10px;overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  #shop::-webkit-scrollbar{width:4px;height:4px}
  #shop::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
  #shopTitle{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--quiet);text-transform:uppercase;padding-left:2px}
  .upg{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;text-align:left;cursor:pointer;color:var(--ink);
    font-family:var(--disp);transition:transform .08s,border-color .15s,opacity .2s;
    outline:none;
  }
  .upg:focus-visible{border-color:var(--cyan)}
  .upg:hover:not(:disabled){transform:translateX(3px);border-color:var(--magenta)}
  .upg:active:not(:disabled){transform:scale(.97)}
  .upg:disabled{opacity:.42;cursor:default}
  .upg .n{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px}
  .upg .n .lv{color:var(--cyan);font-family:var(--mono);font-size:12px;font-weight:600}
  .upg .d{color:var(--quiet);font-size:12px;margin-top:3px;line-height:1.35}
  .upg .c{font-family:var(--mono);font-size:13px;margin-top:7px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:600}
  .upg.canBuy{border-color:rgba(255,198,61,.5);box-shadow:0 0 14px rgba(255,198,61,.12)}
  .upg.asc{border-color:var(--magenta);box-shadow:0 0 16px rgba(255,61,139,.25)}
  .upg.asc .c{color:var(--magenta)}
  .upg.asc:disabled{opacity:.55}

  /* ---------- toasts ---------- */
  #toasts{position:fixed;right:14px;top:14px;z-index:6;display:flex;flex-direction:column;gap:10px;width:250px;pointer-events:none}
  .toast{
    background:var(--panel);border:1px solid var(--gold);border-radius:12px;
    padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 20px rgba(255,198,61,.15);
    animation:toastIn .35s cubic-bezier(.34,1.56,.64,1),toastOut .4s ease-in 3.6s forwards;
  }
  .toast .t{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
  .toast .m{font-weight:700;font-size:14px;margin-top:4px}
  @keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
  @keyframes toastOut{to{transform:translateX(120%);opacity:0}}

  /* ---------- floating numbers ---------- */
  .fnum{
    position:fixed;z-index:6;pointer-events:none;
    font-family:var(--mono);font-weight:900;font-variant-numeric:tabular-nums;
    animation:floatUp .9s ease-out forwards;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
  }
  @keyframes floatUp{
    0%{transform:translate(-50%,0) scale(.7);opacity:0}
    12%{transform:translate(-50%,-14px) scale(1.15);opacity:1}
    100%{transform:translate(-50%,-90px) scale(1);opacity:0}
  }
  .fcrit{
    position:fixed;z-index:6;pointer-events:none;color:var(--gold);
    font-weight:900;font-size:clamp(22px,4vw,34px);letter-spacing:.06em;
    text-shadow:0 0 20px rgba(255,198,61,.8),0 2px 8px rgba(0,0,0,.6);
    animation:critPop 1s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes critPop{
    0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}
    15%{transform:translate(-50%,-50%) scale(1.25) rotate(3deg);opacity:1}
    80%{opacity:1}
    100%{transform:translate(-50%,-120%) scale(1.1);opacity:0}
  }

  /* ---------- flash + banner ---------- */
  #flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);opacity:0;pointer-events:none;z-index:7}
  #flash.go{animation:flashOut .55s ease-out}
  @keyframes flashOut{0%{opacity:1}100%{opacity:0}}
  #lvlBanner{
    position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;
    font-weight:900;font-size:clamp(30px,6vw,54px);letter-spacing:.1em;color:var(--ink);
    text-shadow:0 0 30px var(--magenta),0 0 60px var(--magenta);opacity:0;text-transform:uppercase;
    white-space:nowrap;
  }
  #lvlBanner.go{animation:bannerPop 1.5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes bannerPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
    15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    25%{transform:translate(-50%,-50%) scale(1)}
    80%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-70%) scale(1.05)}
  }

  /* ---------- golden orbs (dynamic) ---------- */
  .gold{
    position:fixed;z-index:6;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 32% 28%,#fff6d8,var(--gold) 55%,#c98f00);
    box-shadow:0 0 30px rgba(255,198,61,.8),0 0 80px rgba(255,198,61,.4);
    outline:none;
  }

  /* ---------- mystery box ---------- */
  #box{
    position:fixed;z-index:6;width:46px;height:46px;border-radius:10px;border:2px solid var(--cyan);
    cursor:pointer;display:none;outline:none;
    background:linear-gradient(135deg,#241f4a,#141225);color:var(--cyan);
    font-weight:900;font-size:22px;font-family:var(--mono);
    box-shadow:0 0 20px rgba(57,240,224,.5);
    animation:boxWobble .8s ease-in-out infinite alternate;
  }
  #box.fly{display:block}
  @keyframes boxWobble{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}

  /* ---------- overcharge ---------- */
  #orb.charging{animation:none}

  /* ---------- goal ladder ---------- */
  #goalRow{font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:8px;text-align:center;
    letter-spacing:.05em;font-variant-numeric:tabular-nums;line-height:1.4}

  /* ---------- red flash (losses) ---------- */
  #redFlash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,40,70,.45),transparent 70%);
    opacity:0;pointer-events:none;z-index:8}
  #redFlash.go{animation:flashOut .6s ease-out}

  /* ---------- cursed orb ---------- */
  .curse{
    position:fixed;z-index:6;width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 32% 28%,#e0b0ff,#9b2bff 50%,#3d0a66);
    box-shadow:0 0 30px rgba(155,43,255,.8),0 0 80px rgba(255,40,70,.4);
    outline:none;
  }

  /* ---------- double or nothing ---------- */
  #gamFab{
    position:fixed;right:18px;bottom:18px;z-index:6;
    background:linear-gradient(135deg,#241f4a,var(--panel));
    border:1px solid var(--gold);border-radius:14px;cursor:pointer;outline:none;
    color:var(--gold);font-family:var(--mono);font-weight:700;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;padding:12px 16px;text-align:center;
    animation:gamPulse 1.6s ease-in-out infinite;
  }
  #gamFab small{display:block;color:var(--quiet);font-size:9px;letter-spacing:.2em;margin-top:3px}
  #gamFab:hover,#gamFab:focus-visible{color:#fff;border-color:#fff}
  @keyframes gamPulse{
    0%,100%{box-shadow:0 0 14px rgba(255,198,61,.35)}
    50%{box-shadow:0 0 30px rgba(255,198,61,.75)}
  }
  #gamOver{position:fixed;inset:0;background:rgba(5,4,12,.78);z-index:9;display:none;
    align-items:center;justify-content:center}
  #gamOver.on{display:flex}
  #gamCard{background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:22px;
    width:min(330px,92vw);text-align:center;box-shadow:0 0 40px rgba(255,198,61,.25)}
  #gamTitle{font-family:var(--mono);letter-spacing:.22em;font-size:12px;color:var(--gold);text-transform:uppercase}
  #gamPts{font-family:var(--mono);font-weight:900;font-size:30px;margin:10px 0 2px;font-variant-numeric:tabular-nums}
  #gamStreak{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-bottom:6px;font-variant-numeric:tabular-nums}
  .gamRow{display:flex;gap:8px;justify-content:center;margin-top:10px}
  .gamBtn{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    font-family:var(--mono);font-weight:700;font-size:13px;padding:12px 6px;cursor:pointer;outline:none}
  .gamBtn:hover:not(:disabled),.gamBtn:focus-visible{border-color:var(--gold)}
  .gamBtn:disabled{opacity:.4;cursor:default}
  .gamBtn.all{color:var(--gold);border-color:rgba(255,198,61,.5)}
  #gamClose{margin-top:14px;background:none;border:none;color:var(--quiet);font-family:var(--mono);
    font-size:12px;cursor:pointer;outline:none}
  #gamClose:hover,#gamClose:focus-visible{color:var(--ink)}
  #gamCoin{width:84px;height:84px;border-radius:50%;margin:14px auto 4px;display:none;
    background:radial-gradient(circle at 32% 28%,#fff6d8,var(--gold) 55%,#c98f00)}
  #gamCoin.spin{display:block;animation:coinFlash .12s linear infinite alternate}
  @keyframes coinFlash{
    from{background:radial-gradient(circle at 32% 28%,#fff,#ff3d8b 60%,#8f0f4d);box-shadow:0 0 30px rgba(255,61,139,.7)}
    to{background:radial-gradient(circle at 32% 28%,#fff6d8,#ffc63d 60%,#c98f00);box-shadow:0 0 30px rgba(255,198,61,.8)}
  }
  #gamRes{font-weight:900;font-size:26px;letter-spacing:.06em;margin-top:8px;min-height:32px}

  /* ---------- transcendence ---------- */
  #transOver{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle,#1b1833,#0b0a14 75%)}
  #transOver.on{display:flex}
  #transCard{text-align:center;padding:24px;max-width:460px}
  #transTitle{font-weight:900;font-size:clamp(34px,7vw,58px);letter-spacing:.12em;text-transform:uppercase;
    text-shadow:0 0 40px var(--gold),0 0 80px var(--magenta)}
  #transStats{font-family:var(--mono);color:var(--quiet);font-size:13px;margin-top:16px;line-height:2;font-variant-numeric:tabular-nums}
  #transGo{margin-top:22px;background:none;border:1px solid var(--gold);border-radius:10px;color:var(--gold);
    font-family:var(--mono);font-size:13px;padding:10px 22px;cursor:pointer;outline:none}
  #transGo:hover,#transGo:focus-visible{background:rgba(255,198,61,.12)}

  /* ---------- timed challenge card ---------- */
  #chal{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:6;width:270px;
    background:var(--panel);border:1px solid var(--cyan);border-radius:12px;
    padding:10px 14px;display:none;text-align:center;
    box-shadow:0 0 24px rgba(57,240,224,.25);
  }
  #chal.on{display:block;animation:chalIn .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes chalIn{from{transform:translate(-50%,-130%);opacity:0}to{transform:translateX(-50%);opacity:1}}
  #chalT{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--cyan);text-transform:uppercase}
  #chalM{font-weight:700;font-size:14px;margin-top:3px}
  #chalBar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:8px}
  #chalFill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:3px}
  #chalTime{font-family:var(--mono);font-size:11px;color:var(--quiet);margin-top:5px;font-variant-numeric:tabular-nums}

  /* ---------- footer ---------- */
  #foot{
    position:fixed;bottom:12px;left:0;right:0;z-index:3;
    display:flex;justify-content:center;gap:14px;
    font-family:var(--mono);font-size:12px;color:var(--quiet);
  }
  #foot button{
    background:none;border:1px solid var(--line);border-radius:8px;color:var(--quiet);
    font-family:var(--mono);font-size:12px;padding:5px 12px;cursor:pointer;outline:none;
  }
  #foot button:hover,#foot button:focus-visible{border-color:var(--cyan);color:var(--ink)}
  #stats{align-self:center;font-variant-numeric:tabular-nums}

  @media (max-width:900px){
    #shop{position:fixed;left:8px;right:8px;top:auto;bottom:52px;width:auto;height:118px;
      flex-direction:row;overflow-x:auto;overflow-y:hidden}
    #shopTitle{display:none}
    .upg{min-width:180px;flex-shrink:0}
    #toasts{width:200px}
    #shake{gap:10px;padding-bottom:180px;padding-top:6px}
    #orbZone{width:min(28vmin,180px);height:min(28vmin,180px)}
    #score{font-size:clamp(32px,6vw,52px)}
    #perSec{margin-top:4px;font-size:12px}
    #rank{margin-top:4px;font-size:10px}
    #feverTag{margin-top:3px}
    #gamFab{right:10px;bottom:184px;padding:10px 12px;font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){
    #orb,body.fever #orb{animation:none}
    #box{animation:none}
    .fnum,.fcrit,.toast,#lvlBanner.go,#flash.go{animation-duration:.01s}
  }
</style>

<div class="bgGlow" id="bgGlow"></div>
<canvas id="fx"></canvas>

<div id="shake">
  <div id="scoreWrap">
    <div id="score">0</div>
    <div id="perSec"><b id="psVal">0</b> /sec &nbsp;&middot;&nbsp; &times;<span id="multVal">1</span> per tap</div>
    <div id="rank">Dopamine Tourist</div>
  </div>

  <div id="orbZone">
    <button id="orb" aria-label="Tap the orb"></button>
    <div id="orbLabel">Tap</div>
  </div>

  <div id="comboWrap">
    <div id="comboLabel">Combo &times;1</div>
    <div id="comboBar"><div id="comboFill"></div></div>
    <div id="feverBar"><div id="feverFill"></div></div>
    <div id="feverTag">fever 0%</div>
  </div>

  <div id="levelWrap">
    <div id="levelRow"><span>Level <b id="lvlVal">1</b></span><span id="xpTxt">0 / 100</span></div>
    <div id="xpBar"><div id="xpFill"></div></div>
    <div id="goalRow"></div>
  </div>
</div>

<div id="shop">
  <div id="shopTitle">Upgrades</div>
</div>

<div id="toasts"></div>
<div id="chal">
  <div id="chalT">Challenge</div>
  <div id="chalM"></div>
  <div id="chalBar"><div id="chalFill"></div></div>
  <div id="chalTime"></div>
</div>
<button id="box" aria-label="Mystery box">?</button>
<div id="heat"></div>
<div id="flash"></div>
<div id="redFlash"></div>
<div id="lvlBanner"></div>

<button id="gamFab">Double or Nothing<small>tap to gamble</small></button>

<div id="gamOver">
  <div id="gamCard">
    <div id="gamTitle">Double or Nothing</div>
    <div id="gamPts">0</div>
    <div id="gamStreak">win streak &times;0</div>
    <div id="gamCoin"></div>
    <div id="gamRes"></div>
    <div class="gamRow">
      <button class="gamBtn" id="gam25">25%</button>
      <button class="gamBtn" id="gam50">50%</button>
      <button class="gamBtn all" id="gam100">ALL IN</button>
    </div>
    <button id="gamClose">walk away</button>
  </div>
</div>

<div id="transOver">
  <div id="transCard">
    <div id="transTitle">Transcendence</div>
    <div id="transStats"></div>
    <button id="transGo">keep going forever</button>
  </div>
</div>

<div id="foot">
  <span id="stats"></span>
  <button id="muteBtn">sound: on</button>
  <button id="resetBtn">reset</button>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============ state ============ */
const SAVE_KEY = "dopamineMachine.v1";
let S = {
  points: 0, total: 0, clicks: 0,
  level: 1, xp: 0,
  crits: 0, bestCombo: 0, goldens: 0,
  fevers: 0, boxes: 0, rushes: 0, chals: 0, asc: 0, last: 0,
  gambles: 0, gambleWins: 0, streakBest: 0, allin: 0,
  curses: 0, overBest: 0, buys: 0, goalIdx: 0, trans: 0,
  upg: { power: 0, auto: 0, crit: 0, combo: 0, fever: 0, lure: 0 },
  ach: {},
  muted: false
};
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    const p = JSON.parse(raw);
    S = Object.assign(S, p, { upg: Object.assign(S.upg, p.upg || {}) });
  }
} catch (e) {}
const save = () => { S.last = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} };
setInterval(save, 3000);

/* ============ session escalation (heat) ============ */
/* Heat rises while you actively tap and slowly cools when idle.
   Hotter session => more events, stronger fevers, bigger visuals. */
let heat = 0;                 // 0..1
let sessionFevers = 0;        // fevers this session make later fevers stronger
const heatUp   = () => { heat = Math.min(1, heat + 0.0014); };
const feverPower = () => 5 + Math.min(sessionFevers, 7);   // x5 first, up to x12

/* ============ derived numbers ============ */
const ascMult  = () => 1 + S.asc;
const xpNeed   = () => Math.floor(100 * Math.pow(1.62, S.level - 1));
const tapBase  = () => (1 + S.upg.power) * S.level * ascMult();
const critCh   = () => Math.min(0.05 + S.upg.crit * 0.03, 0.45);
const autoRate = () => S.upg.auto * Math.max(1, Math.floor((1 + S.upg.power) * S.level * 0.4)) * ascMult();
const comboMax = () => 10 + S.upg.combo * 5;
const buffMult = () => (feverT > 0 ? feverPow : 1) * (doubleT > 0 ? 2 : 1);
const fmt = n => {
  n = Math.floor(n);
  if (n >= 1e9) return (n/1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n/1e6).toFixed(2) + "M";
  if (n >= 1e4) return (n/1e3).toFixed(1) + "k";
  return n.toLocaleString("en-US");
};

/* ============ audio ============ */
let AC = null, master = null;
function audio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.16; master.connect(AC.destination);
  }
  if (AC.state === "suspended") AC.resume();
  return !S.muted;
}
function tone(freq, dur, type, vol, when) {
  if (!audio()) return;
  const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || 0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
const sndTap   = c => tone(300 + Math.min(c, 40) * 22, .09, "square", .35);
const sndCrit  = () => { tone(160, .25, "sawtooth", .5); tone(520, .3, "square", .35, .03); tone(1040, .35, "sine", .3, .06); };
const sndBuy   = () => { tone(420, .1, "square", .4); tone(630, .12, "square", .35, .07); };
const sndAch   = () => { tone(660, .12, "sine", .4); tone(880, .16, "sine", .4, .09); };
const sndGold  = () => [523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,"square",.32,i*.07));
const sndLvl   = () => [392,523,659,784,1047].forEach((f,i)=>tone(f,.3,"sawtooth",.28,i*.09));
const sndFever = () => { for (let i = 0; i < 9; i++) tone(180 + i * 95, .12, "sawtooth", .3, i * .045); };
const sndBox   = () => [660,880,660,1175].forEach((f,i)=>tone(f,.12,"square",.3,i*.06));
const sndChal  = () => { tone(880,.15,"square",.35); tone(660,.15,"square",.35,.18); tone(880,.2,"square",.35,.36); };
const sndFail  = () => { tone(150,.3,"sawtooth",.4); tone(110,.4,"sawtooth",.4,.15); };
const sndWin   = () => [523,659,784,1047].forEach((f,i)=>tone(f,.18,"square",.35,i*.06));
const sndLose  = () => [300,220,160,110].forEach((f,i)=>tone(f,.25,"sawtooth",.4,i*.09));
const sndCurse = () => { tone(220,.5,"sawtooth",.45); tone(233,.5,"sawtooth",.45,.02); tone(90,.6,"sine",.5,.1); };
const sndBurst = () => { tone(70,.5,"sawtooth",.7); tone(55,.6,"square",.5,.05); tone(2000,.05,"square",.2); };

/* ============ canvas particles ============ */
const cv = $("fx"), cx = cv.getContext("2d");
let W = 0, H = 0;
const fit = () => { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px"; };
addEventListener("resize", fit); fit();
const parts = [];
function burst(x, y, n, colors, speed, size) {
  n = Math.round(n * (1 + heat));            // hotter session, bigger bursts
  if (reduced) n = Math.min(n, 6);
  x *= devicePixelRatio; y *= devicePixelRatio;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * speed * devicePixelRatio;
    parts.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - v*0.3,
      life: 1, decay: 0.015 + Math.random()*0.02,
      r: (size + Math.random()*size) * devicePixelRatio,
      c: colors[(Math.random()*colors.length)|0],
      grav: 0.12 * devicePixelRatio, spin: Math.random()*6.28, vs: (Math.random()-.5)*.3,
      rect: Math.random() < 0.5 });
  }
  if (parts.length > 1100) parts.splice(0, parts.length - 1100);
}
function confetti() {
  const n = reduced ? 20 : Math.round(130 * (1 + heat));
  for (let i = 0; i < n; i++) {
    parts.push({ x: Math.random()*W, y: -20*devicePixelRatio,
      vx: (Math.random()-.5)*3*devicePixelRatio, vy: (1+Math.random()*3)*devicePixelRatio,
      life: 1, decay: 0.004 + Math.random()*0.005,
      r: (3+Math.random()*4)*devicePixelRatio,
      c: ["#ff3d8b","#39f0e0","#ffc63d","#f4f0ff","#9b6bff"][(Math.random()*5)|0],
      grav: 0.05*devicePixelRatio, spin: Math.random()*6.28, vs:(Math.random()-.5)*.35, rect:true });
  }
}
function drawParts() {
  cx.clearRect(0, 0, W, H);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life -= p.decay; p.spin += p.vs;
    if (p.life <= 0 || p.y > H + 40) { parts.splice(i, 1); continue; }
    cx.globalAlpha = Math.max(p.life, 0);
    cx.fillStyle = p.c;
    if (p.rect) {
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.spin);
      cx.fillRect(-p.r, -p.r*0.5, p.r*2, p.r); cx.restore();
    } else {
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.2832); cx.fill();
    }
  }
  cx.globalAlpha = 1;
}

/* ============ combo / fever / buffs ============ */
let combo = 0, comboT = 0;
const COMBO_WINDOW = 1.6;
let feverCharge = 0, feverT = 0, feverPow = 5, doubleT = 0, beatI = null;

function startFever() {
  if (feverT > 0) { feverT = 10; return; }
  feverT = 10; feverPow = feverPower();
  sessionFevers++; S.fevers++;
  document.body.classList.add("fever");
  banner("FEVER \u00d7" + feverPow);
  flash(); confetti(); kick(12); sndFever();
  if (!S.muted) beatI = setInterval(() => { tone(85, .12, "sine", .7); tone(2400, .03, "square", .1); }, 240);
  checkAch();
}
function endFever() {
  document.body.classList.remove("fever");
  if (beatI) { clearInterval(beatI); beatI = null; }
}

/* ============ core click ============ */
const orb = $("orb"), zone = $("orbZone");
function orbCenter() { const r = zone.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; }

function tap(cx_, cy_) {
  S.clicks++; heatUp(); lastTapAt = performance.now();
  combo = Math.min(combo + 1, comboMax());
  comboT = COMBO_WINDOW;
  if (combo > S.bestCombo) S.bestCombo = combo;
  chalNote("taps", 1); chalNote("combo", combo);

  const isCrit = Math.random() < critCh();
  let gain = tapBase() * (1 + (combo - 1) * 0.1) * buffMult();
  if (isCrit) { gain *= 10; S.crits++; }
  gain = Math.max(1, Math.floor(gain));
  addPoints(gain);

  // fever meter charges from taps (only while fever is not running)
  if (feverT <= 0) {
    feverCharge += (0.022 + combo * 0.0022) * (1 + S.upg.fever * 0.25);
    if (feverCharge >= 1) { feverCharge = 0; startFever(); }
  }

  // juice
  orb.classList.remove("smash"); void orb.offsetWidth; orb.classList.add("smash");
  setTimeout(() => orb.classList.remove("smash"), 90);
  const ring = document.createElement("div"); ring.className = "ring go";
  zone.appendChild(ring); ring.addEventListener("animationend", () => ring.remove());

  const jx = cx_ + (Math.random()-.5)*30, jy = cy_ - 20 + (Math.random()-.5)*14;
  if (isCrit) {
    critText(cx_, cy_ - 60, "CRIT \u00d710  +" + fmt(gain));
    burst(cx_, cy_, 60, ["#ffc63d","#fff3c4","#ff3d8b"], 7, 4);
    kick(12); sndCrit();
  } else {
    const hot = combo >= comboMax() * 0.8;
    floatNum(jx, jy, "+" + fmt(gain), feverT > 0 ? "#ffc63d" : (hot ? "#39f0e0" : "#ff77ae"), 16 + Math.min(combo, 24));
    burst(cx_, cy_, 8 + Math.min(combo, 22), feverT > 0 ? ["#ffc63d","#ff3d8b","#39f0e0","#fff3c4"] : ["#ff3d8b","#ff77ae","#39f0e0"], 4 + combo*0.1, 2.5);
    if (combo > 5) kick(1 + combo * 0.15);
    sndTap(combo);
  }
  checkAch();
}
/* ---- overcharge: hold the orb to build a multiplier, release to cash out.
   Past x8 it can burst at a hidden random point and cost 10% of your points. ---- */
let holdT0 = 0, charging = false, chargeM = 1, burstAt = 0, chargeAcc = 0;
const orbLabel = $("orbLabel");
function chargeStop() {
  holdT0 = 0; charging = false; chargeAcc = 0;
  orb.classList.remove("charging");
  orb.style.transform = "";
  orbLabel.textContent = "TAP"; orbLabel.style.color = "";
}
function cashOut() {
  const m = chargeM;
  const gain = Math.max(1, Math.floor(tapBase() * m * buffMult()));
  const [x, y] = orbCenter();
  addPoints(gain);
  if (m > S.overBest) S.overBest = m;
  critText(x, y - 60, "OVERCHARGE \u00d7" + m + "  +" + fmt(gain));
  burst(x, y, Math.min(20 + m * 4, 120), ["#ffc63d", "#39f0e0", "#fff3c4"], 6 + m * 0.15, 3.5);
  kick(Math.min(4 + m * 0.5, 16));
  sndWin();
  chargeStop(); checkAch(); save();
}
function doBurst() {
  const penalty = Math.floor(S.points * 0.10);
  S.points -= penalty;
  const [x, y] = orbCenter();
  floatNum(x, y - 40, "BURST  -" + fmt(penalty), "#ff2846", 30);
  burst(x, y, 90, ["#ff2846", "#ff6a3d", "#3d0a66"], 9, 4);
  $("redFlash").classList.remove("go"); void $("redFlash").offsetWidth; $("redFlash").classList.add("go");
  kick(18); sndBurst(); combo = 0; comboT = 0;
  chargeStop(); paint(); save();
}
orb.addEventListener("pointerdown", e => {
  tap(e.clientX, e.clientY);
  holdT0 = performance.now();
  try { orb.setPointerCapture(e.pointerId); } catch (err) {}
});
orb.addEventListener("pointerup", () => { if (charging) cashOut(); else holdT0 = 0; });
orb.addEventListener("pointercancel", () => chargeStop());
orb.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); const [x,y] = orbCenter(); tap(x, y); }
});
orb.addEventListener("keyup", () => { holdT0 = 0; });
orb.addEventListener("contextmenu", e => e.preventDefault());   // long-press hold on mobile

/* ============ points / level ============ */
function addPoints(n) {
  S.points += n; S.total += n; S.xp += n;
  chalNote("points", n);
  $("score").classList.remove("pop"); void $("score").offsetWidth; $("score").classList.add("pop");
  while (S.xp >= xpNeed()) { S.xp -= xpNeed(); S.level++; levelUp(); }
  paint();
}
function levelUp() {
  flash(); banner("Level " + S.level);
  confetti(); kick(10); sndLvl();
  checkAch();
}

/* ============ double or nothing ============ */
let gStreak = 0, spinning = false, spinI = null;
const gamOver = $("gamOver");
function gamPaint() {
  $("gamPts").textContent = fmt(S.points) + " pts";
  $("gamStreak").textContent = "win streak \u00d7" + gStreak +
    (gStreak > 0 ? "  (next win pays +" + (25 * gStreak) + "% extra)" : "");
  [["gam25", .25], ["gam50", .5], ["gam100", 1]].forEach(([id]) => $(id).disabled = spinning || S.points < 20);
}
$("gamFab").addEventListener("click", () => { $("gamRes").textContent = ""; gamPaint(); gamOver.classList.add("on"); });
function gamClose() { if (!spinning) gamOver.classList.remove("on"); }
$("gamClose").addEventListener("click", gamClose);
gamOver.addEventListener("pointerdown", e => { if (e.target === gamOver) gamClose(); });
addEventListener("keydown", e => { if (e.key === "Escape") gamClose(); });
function gamble(frac) {
  if (spinning) return;
  const stake = Math.floor(S.points * frac);
  if (stake < 1) return;
  spinning = true; S.gambles++;
  $("gamRes").textContent = ""; gamPaint();
  $("gamCoin").classList.add("spin");
  let hi = false;
  spinI = setInterval(() => { hi = !hi; tone(hi ? 660 : 440, .08, "square", .25); }, 130);
  setTimeout(() => {
    clearInterval(spinI); $("gamCoin").classList.remove("spin");
    const win = Math.random() < 0.5;
    const res = $("gamRes");
    if (win) {
      const payout = Math.floor(stake * (1 + 0.25 * gStreak));
      gStreak++; S.gambleWins++;
      if (gStreak > S.streakBest) S.streakBest = gStreak;
      if (frac === 1) S.allin = 1;
      addPoints(payout);
      res.textContent = "WIN  +" + fmt(payout); res.style.color = "#ffc63d";
      confetti(); kick(10); sndWin();
    } else {
      S.points -= stake; gStreak = 0;
      res.textContent = "LOST  -" + fmt(stake); res.style.color = "#ff2846";
      $("redFlash").classList.remove("go"); void $("redFlash").offsetWidth; $("redFlash").classList.add("go");
      kick(12); sndLose(); paint();
    }
    spinning = false; gamPaint(); checkAch(); save();
  }, 1400);
}
$("gam25").addEventListener("click", () => gamble(.25));
$("gam50").addEventListener("click", () => gamble(.5));
$("gam100").addEventListener("click", () => gamble(1));

/* ============ cursed orb: 60% dark jackpot, 40% it feeds on you ============ */
let curseT = 60 + Math.random() * 60, curseEl = null, curseF = null;
function spawnCurse() {
  const el = document.createElement("button");
  el.className = "curse"; el.setAttribute("aria-label", "Cursed orb \u2014 risky!");
  document.body.appendChild(el);
  curseEl = el;
  curseF = { t: 0, dur: 4, fromLeft: Math.random() < 0.5,
    y0: innerHeight * (0.12 + Math.random() * 0.5), amp: 60 + Math.random() * 60 };
  el.addEventListener("pointerdown", e => {
    el.remove(); curseEl = null; curseF = null;
    if (Math.random() < 0.6) {
      const jp = Math.max(1000, Math.floor(S.total * 0.12));
      addPoints(jp);
      critText(e.clientX, e.clientY, "DARK JACKPOT +" + fmt(jp));
      burst(e.clientX, e.clientY, 100, ["#9b2bff", "#e0b0ff", "#ffc63d"], 8, 4);
      confetti(); kick(14); sndGold();
    } else {
      const loss = Math.floor(S.points * 0.20);
      S.points -= loss; S.curses++;
      floatNum(e.clientX, e.clientY, "CURSED  -" + fmt(loss), "#ff2846", 28);
      burst(e.clientX, e.clientY, 70, ["#ff2846", "#9b2bff", "#3d0a66"], 7, 3.5);
      $("redFlash").classList.remove("go"); void $("redFlash").offsetWidth; $("redFlash").classList.add("go");
      kick(14); sndCurse(); paint();
    }
    checkAch(); save();
  });
}

/* ============ the goal ladder (purpose) ============ */
const GOALS = [
  { t: "Reach level 5",          test: () => S.level >= 5,       rt: "+500 pts",      r: () => addPoints(500) },
  { t: "Hit combo \u00d710",     test: () => S.bestCombo >= 10,  rt: "+1.5k pts",     r: () => addPoints(1500) },
  { t: "Buy 4 upgrades",         test: () => S.buys >= 4,        rt: "instant FEVER", r: () => startFever() },
  { t: "Catch 3 golden orbs",    test: () => S.goldens >= 3,     rt: "+5k pts",       r: () => addPoints(5000) },
  { t: "Win a challenge",        test: () => S.chals >= 1,       rt: "+8k pts",       r: () => addPoints(8000) },
  { t: "Win a gamble",           test: () => S.gambleWins >= 1,  rt: "+10k pts",      r: () => addPoints(10000) },
  { t: "Overcharge to \u00d712", test: () => S.overBest >= 12,   rt: "+20k pts",      r: () => addPoints(20000) },
  { t: "Reach 100k lifetime",    test: () => S.total >= 1e5,     rt: "\u00d72 for 60s", r: () => { doubleT = 60; } },
  { t: "Gamble streak \u00d73",  test: () => S.streakBest >= 3,  rt: "+50k pts",      r: () => addPoints(50000) },
  { t: "Ascend",                 test: () => S.asc >= 1,         rt: "+25k pts",      r: () => addPoints(25000) },
  { t: "Reach 1M lifetime",      test: () => S.total >= 1e6,     rt: "max heat",      r: () => { heat = 1; } },
  { t: "Win 10 challenges",      test: () => S.chals >= 10,      rt: "+200k pts",     r: () => addPoints(200000) },
  { t: "Ascend 3 times",         test: () => S.asc >= 3,         rt: "+1M pts",       r: () => addPoints(1e6) },
  { t: "Reach 25M lifetime",     test: () => S.total >= 25e6,    rt: "???",           r: () => transcend() }
];
let goalBusy = false;
function checkGoal() {
  if (goalBusy) return;
  goalBusy = true;
  while (S.goalIdx < GOALS.length && GOALS[S.goalIdx].test()) {
    const g = GOALS[S.goalIdx];
    S.goalIdx++;
    banner("GOAL COMPLETE");
    toast("Goal " + S.goalIdx + "/" + GOALS.length, g.t + " \u2014 " + g.rt);
    flash(); confetti(); sndLvl();
    g.r(); save();
  }
  goalBusy = false;
  const row = $("goalRow");
  row.textContent = S.goalIdx < GOALS.length
    ? "GOAL " + (S.goalIdx + 1) + "/" + GOALS.length + ": " + GOALS[S.goalIdx].t + "  (" + GOALS[S.goalIdx].rt + ")"
    : "you have transcended \u2014 endless mode";
}
function transcend() {
  S.trans = 1;
  $("transStats").innerHTML =
    "lifetime <b>" + fmt(S.total) + "</b> pts<br>" +
    fmt(S.clicks) + " taps \u00b7 " + S.fevers + " fevers \u00b7 " + S.goldens + " golden orbs<br>" +
    S.chals + " challenges \u00b7 " + S.gambleWins + " gambles won \u00b7 ascension " + S.asc;
  $("transOver").classList.add("on");
  confetti(); confetti(); confetti(); sndLvl(); sndGold(); kick(16);
  checkAch(); save();
}
$("transGo").addEventListener("click", () => $("transOver").classList.remove("on"));

/* ============ timed challenges ============ */
let chal = null, chalWait = 45 + Math.random() * 30, lastTapAt = 0;
function makeChallenge() {
  const pick = ["taps", "points", "combo", "golden"][(Math.random() * 4) | 0];
  let c;
  if (pick === "taps") c = { type: "taps", goal: 40, dur: 10, text: "Land 40 taps" };
  else if (pick === "combo") c = { type: "combo", goal: comboMax(), dur: 12, text: "Hit combo \u00d7" + comboMax() };
  else if (pick === "golden") {
    c = { type: "golden", goal: 2, dur: 20, text: "Catch 2 golden orbs" };
    spawnGolden(0.5); spawnGolden(4); spawnGolden(8);
  } else {
    // achievable in ~15s of active tapping plus auto income
    const goal = Math.max(300, Math.floor((tapBase() * 5 * 1.5 + autoRate()) * 15 * 0.8));
    c = { type: "points", goal, dur: 15, text: "Earn " + fmt(goal) + " pts" };
  }
  c.prog = 0; c.t = c.dur;
  c.reward = Math.max(800, Math.floor(S.total * 0.08));
  return c;
}
function startChallenge() {
  chal = makeChallenge();
  $("chalM").textContent = chal.text + "  (+" + fmt(chal.reward) + ")";
  $("chal").classList.add("on");
  banner("CHALLENGE"); sndChal(); kick(6);
}
function chalNote(kind, val) {
  if (!chal || chal.type !== kind) return;
  if (kind === "combo") chal.prog = Math.max(chal.prog, val);
  else chal.prog += val;
}
function winChallenge() {
  const r = chal.reward;
  chal = null; S.chals++;
  $("chal").classList.remove("on");
  addPoints(r);
  banner("CHALLENGE +" + fmt(r));
  flash(); confetti(); kick(12); sndGold(); sndLvl();
  heat = Math.min(1, heat + 0.2);
  chalWait = 50 + Math.random() * 40;
  checkAch(); save();
}
function failChallenge() {
  chal = null;
  $("chal").classList.remove("on");
  toast("Challenge", "Failed \u2014 next one comes soon");
  sndFail();
  chalWait = 35 + Math.random() * 30;
}

/* ============ ranks ============ */
const RANKS = [
  [0,    "Dopamine Tourist"],
  [1e3,  "Dopamine Dabbler"],
  [1e4,  "Dopamine Enjoyer"],
  [1e5,  "Dopamine Fiend"],
  [1e6,  "Dopamine Addict"],
  [1e7,  "Dopamine Machine"],
  [1e8,  "Certified Menace"],
  [1e9,  "Transcendent Being"]
];
let lastRank = null;
function rankName() {
  let r = RANKS[0][1];
  for (const [t, n] of RANKS) if (S.total >= t) r = n;
  return r;
}

/* ============ paint ============ */
function paint() {
  $("score").textContent = fmt(S.points);
  $("psVal").textContent = fmt(autoRate());
  $("multVal").textContent = fmt(tapBase());
  $("lvlVal").textContent = S.level;
  $("xpTxt").textContent = fmt(S.xp) + " / " + fmt(xpNeed());
  $("xpFill").style.width = Math.min(100, S.xp / xpNeed() * 100) + "%";
  $("stats").textContent = "taps " + fmt(S.clicks) + " \u00b7 combo \u00d7" + S.bestCombo +
    " \u00b7 fevers " + S.fevers + (S.asc ? " \u00b7 ascension " + S.asc : "");
  UPGRADES.forEach(u => {
    const b = upgBtns[u.k], c = cost(u);
    b.querySelector(".lv").textContent = "Lv " + S.upg[u.k];
    b.querySelector(".c").textContent = fmt(c) + " pts";
    const afford = S.points >= c;
    b.disabled = !afford;
    b.classList.toggle("canBuy", afford);
  });
  // ascension card
  const nm = 2 + S.asc;
  ascBtn.style.display = (S.level >= 10 || S.asc > 0) ? "" : "none";
  ascBtn.querySelector(".lv").textContent = "\u00d7" + ascMult();
  ascBtn.querySelector(".d").textContent =
    "Reset this run, keep achievements. Permanent \u00d7" + nm + " to everything.";
  ascBtn.querySelector(".c").textContent =
    (ascArmed && Date.now() - ascArmed <= 2500) ? "resets your run \u2014 click again"
    : S.level >= 10 ? "ready \u2014 no cost" : "requires level 10";
  ascBtn.disabled = S.level < 10;
  // rank
  const rn = rankName();
  if (rn !== lastRank) {
    $("rank").textContent = rn;
    if (lastRank !== null) { banner(rn); flash(); confetti(); sndLvl(); }
    lastRank = rn;
  }
}

/* ============ main loop ============ */
let last = performance.now(), autoAcc = 0, glowAcc = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;

  // overcharge: transition into charging after a 350ms hold, then climb
  if (holdT0 && !charging && now - holdT0 > 350) {
    charging = true; chargeM = 1; chargeAcc = 0;
    burstAt = 8 + Math.random() * 22;      // hidden burst point, always past x8
    orb.classList.add("charging");
  }
  if (charging) {
    chargeAcc += dt;
    if (chargeAcc >= 0.22) {
      chargeAcc = 0; chargeM++;
      tone(200 + chargeM * 40, .06, "square", .3);
      if (chargeM >= burstAt) doBurst();
    }
    if (charging) {
      orb.style.transform = "scale(" + (1 + Math.min(chargeM, 30) * 0.012) + ")";
      orbLabel.textContent = "\u00d7" + chargeM;
      orbLabel.style.color = chargeM < 8 ? "#fff" : (chargeM < 16 ? "#ffc63d" : "#ff2846");
    }
  }

  // combo decay
  if (comboT > 0) {
    comboT -= dt;
    if (comboT <= 0) combo = 0;
  }
  const cl = $("comboLabel");
  cl.textContent = "Combo \u00d7" + combo + (combo >= comboMax() ? " MAX" : "");
  cl.classList.toggle("hot", combo >= 2);
  $("comboFill").style.width = (comboT / COMBO_WINDOW * 100) + "%";

  // fever + double timers
  if (feverT > 0) { feverT -= dt; if (feverT <= 0) endFever(); }
  if (doubleT > 0) doubleT -= dt;
  $("feverFill").style.width = (feverT > 0 ? feverT / 10 * 100 : feverCharge * 100) + "%";
  const tags = [];
  if (feverT > 0) tags.push("FEVER \u00d7" + feverPow + " " + feverT.toFixed(1) + "s");
  if (doubleT > 0) tags.push("\u00d72 " + Math.ceil(doubleT) + "s");
  $("feverTag").textContent = tags.length ? tags.join("  \u00b7  ") : "fever " + Math.round(feverCharge * 100) + "%";

  // heat cools slowly; strip + glow reflect it
  heat = Math.max(0, heat - dt * 0.002);
  $("heat").style.width = (heat * 100) + "%";
  glowAcc += dt;
  if (glowAcc > 0.25) { glowAcc = 0; $("bgGlow").style.filter = "brightness(" + (1 + heat * 1.6) + ")"; }

  // auto income
  if (autoRate() > 0) {
    autoAcc += autoRate() * buffMult() * dt;
    if (autoAcc >= 1) {
      const n = Math.floor(autoAcc); autoAcc -= n;
      addPoints(n);
      if (Math.random() < 0.25) {
        const [x, y] = orbCenter();
        burst(x, y, 3, ["#39f0e0"], 2, 2);
      }
    }
  }

  // golden orb scheduling (heat + lure make them come faster)
  goldT -= dt * (1 + heat + S.upg.lure * 0.2);
  if (goldT <= 0 && golds.length === 0) { spawnGolden(0); goldT = 25 + Math.random() * 30; }
  for (let i = golds.length - 1; i >= 0; i--) {
    const f = golds[i];
    f.t += dt;
    if (f.t < 0) continue;
    const p = f.t / f.dur;
    if (p >= 1) { f.el.remove(); golds.splice(i, 1); continue; }
    f.el.style.display = "block";
    const x = f.fromLeft ? p * (innerWidth + 80) - 60 : innerWidth - p * (innerWidth + 80) + 20;
    const y = f.y0 + Math.sin(p * Math.PI * 3) * f.amp;
    f.el.style.left = x + "px"; f.el.style.top = y + "px";
  }

  // timed challenges: only offered while the player is actively tapping
  if (!chal) {
    if (now - lastTapAt < 8000 && lastTapAt > 0) {
      chalWait -= dt * (1 + heat * 0.5);
      if (chalWait <= 0) startChallenge();
    }
  } else {
    chal.t -= dt;
    $("chalFill").style.width = Math.min(100, chal.prog / chal.goal * 100) + "%";
    $("chalTime").textContent = chal.t.toFixed(1) + "s";
    if (chal.prog >= chal.goal) winChallenge();
    else if (chal.t <= 0) failChallenge();
  }

  // cursed orb: only once you have something to lose
  if (S.total > 5000) {
    if (!curseEl) {
      curseT -= dt * (1 + heat);
      if (curseT <= 0) { spawnCurse(); curseT = 50 + Math.random() * 70; }
    } else if (curseF) {
      curseF.t += dt;
      const p = curseF.t / curseF.dur;
      if (p >= 1) { curseEl.remove(); curseEl = null; curseF = null; }
      else {
        const x = curseF.fromLeft ? p * (innerWidth + 80) - 60 : innerWidth - p * (innerWidth + 80) + 20;
        curseEl.style.left = x + "px";
        curseEl.style.top = (curseF.y0 + Math.sin(p * Math.PI * 4) * curseF.amp) + "px";
      }
    }
  }

  // gold rush: unlocked by a hot session
  if (heat >= 0.5) {
    rushT -= dt;
    if (rushT <= 0) { goldRush(); rushT = 100 + Math.random() * 60; }
  } else if (rushT > 200) rushT = 35;   // first rush comes soon after the session heats up

  // mystery box scheduling + fall
  if (!boxFly) {
    boxT -= dt * (1 + heat + S.upg.lure * 0.2);
    if (boxT <= 0) { launchBox(); boxT = 35 + Math.random() * 45; }
  } else {
    boxFly.t += dt;
    const p = boxFly.t / boxFly.dur;
    if (p >= 1) { boxFly = null; box.classList.remove("fly"); }
    else {
      box.style.left = (boxFly.x0 + Math.sin(p * Math.PI * 4) * boxFly.sway) + "px";
      box.style.top = (-50 + p * (innerHeight + 100)) + "px";
    }
  }

  // shake decay
  if (shakeAmt > 0.1) {
    shakeAmt *= 0.86;
    shakeEl.style.transform = "translate(" + ((Math.random()-.5)*shakeAmt) + "px," + ((Math.random()-.5)*shakeAmt) + "px)";
  } else if (shakeEl.style.transform) shakeEl.style.transform = "";

  drawParts();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============ footer ============ */
$("muteBtn").addEventListener("click", () => {
  S.muted = !S.muted;
  $("muteBtn").textContent = "sound: " + (S.muted ? "off" : "on");
  if (S.muted && beatI) { clearInterval(beatI); beatI = null; }
  save();
});
$("muteBtn").textContent = "sound: " + (S.muted ? "off" : "on");
let resetArmed = 0;
$("resetBtn").addEventListener("click", () => {
  if (Date.now() - resetArmed > 2500) {   // first click arms, second confirms
    resetArmed = Date.now();
    $("resetBtn").textContent = "wipe all? click again";
    setTimeout(() => { if (Date.now() - resetArmed >= 2500) $("resetBtn").textContent = "reset"; }, 2700);
    return;
  }
  localStorage.removeItem(SAVE_KEY);
  location.reload();
});

paint();
checkAch();

/* ============ offline earnings ============ */
(() => {
  const away = S.last ? (Date.now() - S.last) / 1000 : 0;
  if (away > 60 && autoRate() > 0) {
    const earn = Math.floor(Math.min(away, 28800) * autoRate());   // capped at 8h
    if (earn > 0) {
      addPoints(earn);
      toast("While you were away", "+" + fmt(earn) + " pts");
    }
  }
})();
})();
</script>
